        strip-components: 0
        only-arches:
          - x86_64

      - type: archive
        url: https://github.com/ilijaruzic/loopa-packages/releases/download/v2.2.3/loopa-flatpak-aarch64.tar.gz
        sha256: dd7e4f0e9f56aa241cf1592a4125da4f3be018339d26cb0c7c358f5bd12f4237
        strip-components: 0
        only-arches:
          - aarch64

id: rs.ilijaruzic.loopa
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: loopa

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: loopa
    buildsystem: cmake

    sources:
      - type: archive
        url: https://github.com/ilijaruzic/loopa-packages/releases/download/v2.2.0/loopa-flatpak-x86_64.tar.gz
        sha256: 16214207a6d0da0ac98ce4052fbe54d88c5e87db1726279f72cb9ccf999354a8
        strip-components: 0
        only-arches:
          - x86_64

      - type: archive
        url: https://github.com/ilijaruzic/loopa-packages/releases/download/v2.2.0/loopa-flatpak-aarch64.tar.gz
        sha256: ff53e04b5a80ec845f3d6f9f02e63864ec16d043599a1a5ea1658a02e81770b8
        strip-components: 0
        only-arches:
          - aarch64

        url: https://github.com/ilijaruzic/loopa-packages/releases/download/v1.10.9/loopa-flatpak-aarch64.tar.gz
        sha256: ae864f6ade9cf704dd54f632468752644f2501c2952b79368cd0e945ad4c37cf
        strip-components: 0
        only-arches:
          - aarch64

id: rs.ilijaruzic.loopa
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: loopa

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: loopa
    buildsystem: cmake

    sources:
      - type: archive
        url: https://github.com/ilijaruzic/loopa-packages/releases/download/v2.2.7/loopa-flatpak-x86_64.tar.gz
        sha256: acadb89d06d53be2b09d3deee3343fd0b4862c444067012ded9f25e807f0a329
        strip-components: 0
        only-arches:
          - x86_64

      - type: archive
        url: https://github.com/ilijaruzic/loopa-packages/releases/download/v2.2.7/loopa-flatpak-aarch64.tar.gz
        sha256: a25e5b53146fa26e2140263e71806ceb91dfaf2a434c5168aeede974f8cf2bbb
        strip-components: 0
        only-arches:
          - aarch64
